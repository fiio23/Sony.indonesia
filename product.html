<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony Indonesia - Produk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">SONY</div>
        <nav>
            <a href="index.html#produk">Produk</a>
            <a href="#">Dukungan</a>
            <a href="index.html">My Sony</a>
        </nav>
    </header>

    <section class="product-hero">
        <div class="container">
            <div class="product-hero-grid">
                <div class="product-gallery">
                    <img id="product-main-img" src="" alt="" class="main-image">
                </div>
                <div class="product-info">
                    <p class="product-category" id="product-category"></p>
                    <h1 class="product-title" id="product-title"></h1>
                    <p class="product-description" id="product-description"></p>
                    <div class="product-price" id="product-price"></div>
                    <div class="product-actions">
                        <a href="#" class="btn-primary btn-buy">Beli Sekarang</a>
                        <a href="#" class="btn-secondary btn-compare">Bandingkan</a>
                    </div>
                    <div class="product-highlights" id="product-highlights"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="product-specs container">
        <h2 class="section-title">Spesifikasi Lengkap</h2>
        <div class="specs-grid" id="product-specs"></div>
    </section>

    <section class="product-features container">
        <h2 class="section-title">Fitur Unggulan</h2>
        <div class="features-grid" id="product-features"></div>
    </section>

    <section class="container related-section">
        <h2 class="section-title">Produk Terkait</h2>
        <div class="grid-container" id="related-products"></div>
    </section>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <h3>SONY</h3>
                <p>Sony Indonesia</p>
            </div>
            <div class="footer-links">
                <h4>Produk</h4>
                <ul>
                    <li><a href="product.html?id=a7v">Kamera</a></li>
                    <li><a href="product.html?id=wh1000xm5">Headphone</a></li>
                    <li><a href="product.html?id=bravia8">TV</a></li>
                </ul>
            </div>
            <div class="footer-links">
                <h4>Dukungan</h4>
                <ul>
                    <li><a href="https://www.sony.co.id/en/electronics/support" target="_blank">Bantuan</a></li>
                    <li><a href="https://web.sony-asia.com/id/contact-us/" target="_blank">Kontak</a></li>
                    <li><a href="#">Garansi</a></li>
                </ul>
            </div>
            <div class="footer-links">
                <h4>Tentang Kami</h4>
                <ul>
                    <li><a href="https://maps.app.goo.gl/fsorSerAx5EJ6qBKA" target="_blank">Perusahaan</a></li>

                    <li><a href="https://www.sony.com/en/SonyInfo/Careers/" target="_blank">Karir</a></li>
                </ul>

        </div>
